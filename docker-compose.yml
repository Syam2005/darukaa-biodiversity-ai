version: "3.9"
services:
  api:
    build: .
    ports:
      - "8000:8000"
    restart: unless-stopped
  frontend:
    image: python:3.12-slim
    working_dir: /site
    volumes:
      - ./frontend:/site
    command: ["python", "-m", "http.server", "5173"]
    ports:
      - "5173:5173"
    depends_on:
      - api
